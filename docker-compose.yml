# Local development services. `docker compose up -d` then `npm run db:push && npm run db:seed`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: surveyflow
      POSTGRES_PASSWORD: surveyflow
      POSTGRES_DB: surveyflow
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes:
  pgdata:
